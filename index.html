<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230066cc'/%3E%3Ctext x='16' y='22' font-size='17' font-family='system-ui,sans-serif' font-weight='600' fill='%23fff' text-anchor='middle'%3E인%3C/text%3E%3C/svg%3E">
<title>한빛상사 인사·총무 업무 시스템 (교육용 가상 자료)</title>
<style>
  /* ===================================================================
     디자인 언어: design.md (Apple 웹 디자인 분석) 적용
     - 단일 액션 블루 #0066cc · 근블랙 잉크 #1d1d1f · 파치먼트 #f5f5f7
     - 그림자 없음 (Apple은 제품 사진에만 그림자를 씀) → 헤어라인과 면색으로 위계
     - 핵심 액션은 알약(pill), 카드는 18px, 유틸 버튼은 11px
     - 디스플레이 크기에 음수 자간(Apple tight)
     ※ 업무용 앱이라 표 밀도는 유지했습니다. 원문의 80px 섹션 여백은 쓰지 않습니다.
     =================================================================== */
  :root{
    /* 면 */
    --canvas:#ffffff;          --parchment:#f5f5f7;     --pearl:#fafafc;
    --tile-1:#272729;          --tile-2:#2a2a2c;        --tile-3:#252527;
    --bg:#f5f5f7;              --surface:#ffffff;       --surface-2:#fafafc;
    /* 잉크 */
    --ink:#1d1d1f;             --ink-2:#333333;         --ink-3:#7a7a7a;
    --on-dark:#ffffff;         --on-dark-soft:#cccccc;
    /* 헤어라인 */
    --line:#e0e0e0;            --line-soft:#f0f0f0;     --line-strong:#d2d2d7;
    /* 단일 액센트 */
    --accent:#0066cc;          --accent-focus:#0071e3;  --accent-on-dark:#2997ff;
    --accent-soft:#eaf2fc;     --accent-ink:#0066cc;
    /* 의미색 — 업무 데이터에 꼭 필요한 만큼만, 채도를 낮춰 액센트를 침범하지 않게 */
    --ok:#1d7a44;              --ok-soft:#eaf5ee;
    --warn:#8a5a12;            --warn-soft:#faf1e3;
    --danger:#b8342a;          --danger-soft:#fbeceb;
    /* 라운드 */
    --r-sm:8px; --r-md:11px; --r-lg:18px; --r-pill:9999px;
    --radius:18px; --shadow:none;
    --nav:#272729; --nav-2:#2a2a2c; --nav-ink:#cccccc;
    --font:-apple-system,BlinkMacSystemFont,system-ui,"Inter","Pretendard","SF Pro Text","Segoe UI","Malgun Gothic","맑은 고딕",sans-serif;
  }
  *{box-sizing:border-box}
  /* 본문은 design.md의 {typography.body} 17px 원칙을 따른다.
     표·버튼처럼 빽빽한 곳만 {typography.caption} 14px으로 내린다.
     (design.md: caption = "Secondary captions, button text") */
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
       font-size:17px;line-height:1.47;letter-spacing:-.022em;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent-focus);outline-offset:2px}

  /* ---------- 교육용 안내 띠 (다크 타일 + Apple sticky bar의 backdrop blur) ---------- */
  .edu-banner{
    background:var(--tile-1);color:var(--on-dark-soft);
    padding:11px 24px;font-size:14px;font-weight:400;letter-spacing:-.224px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:50;
  }
  @supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .edu-banner{background:rgba(39,39,41,.82);
      backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}
  }
  .edu-banner b{background:#f5a623;color:#1d1d1f;border-radius:var(--r-pill);
    padding:2px 12px;font-size:12px;font-weight:600;letter-spacing:0}
  .edu-banner u{color:#fff;text-decoration-color:var(--accent-on-dark);text-underline-offset:3px}
  .edu-banner span{opacity:.72;font-size:13px}

  /* ---------- 레이아웃 ---------- */
  .shell{display:flex;min-height:calc(100vh - 46px)}
  nav.side{width:236px;flex:0 0 236px;background:var(--tile-1);color:var(--on-dark-soft);
    display:flex;flex-direction:column;padding:26px 0 20px}
  .brand{padding:0 22px 20px;border-bottom:1px solid rgba(255,255,255,.10);margin-bottom:16px}
  .brand .co{color:#fff;font-size:21px;font-weight:600;letter-spacing:-.374px;line-height:1.19}
  .brand .sub{font-size:13px;color:#8e8e93;margin-top:5px;letter-spacing:-.224px}
  .brand .tag{display:inline-block;margin-top:12px;font-size:12px;font-weight:600;
    color:#1d1d1f;background:#f5a623;border-radius:var(--r-pill);padding:2px 12px;letter-spacing:0}
  nav.side button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;
    cursor:pointer;padding:10px 22px;color:var(--on-dark-soft);text-align:left;
    font-size:15px;letter-spacing:-.224px;transition:background .15s,color .15s}
  nav.side button:hover{background:var(--tile-2);color:#fff}
  nav.side button.on{background:var(--tile-2);color:#fff;font-weight:600}
  nav.side button.on .ic{color:var(--accent-on-dark)}
  nav.side button:active{transform:scale(.97)}
  nav.side button .ic{width:18px;text-align:center;font-size:14px;opacity:.9}
  nav.side button .pip{margin-left:auto;background:var(--accent);color:#fff;font-size:12px;
    font-weight:600;border-radius:var(--r-pill);padding:1px 8px;min-width:20px;text-align:center;letter-spacing:0}
  .side-foot{margin-top:auto;padding:18px 22px 0;border-top:1px solid rgba(255,255,255,.10);
    font-size:12px;color:#8e8e93;line-height:1.65;letter-spacing:-.12px}

  main{flex:1;min-width:0;padding:32px 36px 72px}
  .page-head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:24px}
  .page-head h1{margin:0;font-size:34px;font-weight:600;letter-spacing:-.374px;line-height:1.12}
  .page-head p{margin:6px 0 0;color:var(--ink-3);font-size:17px;letter-spacing:-.374px;line-height:1.47}
  .page-head .tools{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  /* ---------- 카드 · 통계 (그림자 없음, 헤어라인만) ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
  .card>h2{margin:0;padding:18px 24px;border-bottom:1px solid var(--line-soft);
    font-size:17px;font-weight:600;letter-spacing:-.374px;display:flex;align-items:center;gap:10px}
  .card>h2 .hint{margin-left:auto;font-weight:400;font-size:14px;color:var(--ink-3);letter-spacing:-.224px}
  .card .body{padding:24px}
  .grid{display:grid;gap:20px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 24px}
  .stat .lab{font-size:14px;color:var(--ink-3);font-weight:400;letter-spacing:-.224px}
  .stat .num{font-size:40px;font-weight:600;letter-spacing:-.028em;line-height:1.10;
    margin-top:6px;font-variant-numeric:tabular-nums}
  .stat .num small{font-size:17px;font-weight:400;color:var(--ink-3);letter-spacing:-.374px;margin-left:4px}
  .stat .sub{font-size:14px;color:var(--ink-3);margin-top:4px;letter-spacing:-.224px}
  .stat.w .num{color:var(--warn)} .stat.d .num{color:var(--danger)} .stat.g .num{color:var(--ink)}

  /* ---------- 표 ---------- */
  table{width:100%;border-collapse:collapse;font-size:14px;letter-spacing:-.224px}
  th,td{padding:11px 16px;text-align:left;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  thead th{background:var(--pearl);color:var(--ink-2);font-weight:600;font-size:13px;
    white-space:nowrap;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line)}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--pearl)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  td.mid,th.mid{text-align:center}
  .scroll{overflow:auto;max-height:62vh}
  .empty{padding:56px 24px;text-align:center;color:var(--ink-3);font-size:17px;letter-spacing:-.374px}

  /* ---------- 상태 칩 (알약) ---------- */
  .pill{display:inline-block;padding:3px 11px;border-radius:var(--r-pill);font-size:13px;
    font-weight:400;white-space:nowrap;border:1px solid transparent;letter-spacing:-.224px}
  .p-ok{background:var(--ok-soft);color:var(--ok)}
  .p-warn{background:var(--warn-soft);color:var(--warn)}
  .p-danger{background:var(--danger-soft);color:var(--danger)}
  .p-acc{background:var(--accent-soft);color:var(--accent)}
  .p-mute{background:var(--line-soft);color:var(--ink-2)}

  /* ---------- 버튼: 두 가지 문법 (블루 알약 / 펄 캡슐) ---------- */
  .btn{border:1px solid rgba(0,0,0,.08);background:var(--pearl);border-radius:var(--r-md);
    padding:9px 16px;cursor:pointer;font-size:14px;font-weight:400;color:var(--ink-2);
    white-space:nowrap;letter-spacing:-.224px;transition:background .15s,border-color .15s,transform .1s}
  .btn:hover{background:#f0f0f2;border-color:rgba(0,0,0,.14)}
  .btn:active{transform:scale(.95)}
  .btn.primary,.btn.ok{background:var(--accent);border-color:var(--accent);color:#fff;
    border-radius:var(--r-pill);padding:9px 22px;font-weight:400}
  .btn.primary:hover,.btn.ok:hover{background:#0058b3;border-color:#0058b3}
  .btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger);
    border-radius:var(--r-pill);padding:9px 20px}
  .btn.danger:hover{background:var(--danger-soft)}
  .btn.sm{padding:5px 14px;font-size:13px}
  .btn.sm.primary,.btn.sm.ok,.btn.sm.danger{padding:5px 16px}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

  /* ---------- 입력 ---------- */
  /* 입력 폼은 본문과 같은 17px — design.md의 search-input(17px) 문법 */
  input[type=text],input[type=date],input[type=number],select,textarea{
    border:1px solid rgba(0,0,0,.12);border-radius:var(--r-md);padding:10px 14px;
    background:#fff;min-width:0;font-size:17px;letter-spacing:-.374px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-focus);outline-offset:0;border-color:transparent}
  label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;
    color:var(--ink-2);letter-spacing:-.224px}
  .formrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;align-items:end}
  /* 필터 줄은 조작용 도구라 caption 크기(14px)로 통일 */
  .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 24px;
    border-bottom:1px solid var(--line-soft);background:var(--pearl);font-size:14px}
  .filters select,.filters input{font-size:14px;padding:7px 12px;letter-spacing:-.224px}
  .filters .spacer{margin-left:auto}
  .note{font-size:14px;color:var(--ink-3);margin:12px 0 0;letter-spacing:-.224px;line-height:1.5}

  /* ---------- 근태 달력표 (밀도 유지) ---------- */
  .att-tbl{font-size:12px;letter-spacing:0}
  .att-tbl th,.att-tbl td{padding:6px 4px;text-align:center;white-space:nowrap}
  .att-tbl th.nm,.att-tbl td.nm{text-align:left;position:sticky;left:0;background:var(--surface);
    z-index:1;min-width:106px;border-right:1px solid var(--line)}
  .att-tbl thead th.nm{background:var(--pearl);z-index:3}
  .att-tbl td.nm small{color:var(--ink-3);display:block;font-size:12px;line-height:1.25}
  .att-tbl th.we,.att-tbl td.we{background:#ececed;color:var(--ink-3)}
  .att-tbl th.ho,.att-tbl td.ho{background:#fbe9e7;color:var(--danger)}
  .mk{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:var(--r-sm);
    font-size:12px;font-weight:600}
  .mk-o{color:#c7c7cc} .mk-l{background:var(--warn-soft);color:var(--warn)}
  .mk-e{background:var(--accent-soft);color:var(--accent)} .mk-a{background:var(--danger-soft);color:var(--danger)}
  .mk-v{background:var(--ok-soft);color:var(--ok)} .mk-h{background:var(--ok-soft);color:var(--ok)}
  .mk-t{background:var(--accent-soft);color:var(--accent)} .mk-s{background:#f2eefa;color:#6b4bb0}
  .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);
    padding:16px 24px;border-top:1px solid var(--line-soft);background:var(--pearl);letter-spacing:-.224px}
  .legend span{display:flex;align-items:center;gap:6px}

  .two{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;align-items:start}
  @media(max-width:1080px){.two{grid-template-columns:1fr}}
  @media(max-width:720px){
    .shell{flex-direction:column} nav.side{width:100%;flex:none}
    nav.side .navlist{display:flex;overflow-x:auto} nav.side button{width:auto}
    .side-foot{display:none} main{padding:20px 16px 48px} .page-head h1{font-size:28px}
  }
  .toast{position:fixed;right:24px;bottom:24px;z-index:99;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
  .toast div{background:var(--tile-1);color:#fff;padding:13px 22px;border-radius:var(--r-md);
    font-size:17px;letter-spacing:-.374px;animation:pop .25s ease}
  .toast div.bad{background:var(--danger)}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .watermark{margin-top:40px;text-align:center;font-size:12px;color:var(--ink-3);letter-spacing:-.12px}
</style>
</head>

<div class="edu-banner" id="eduBanner">
  <b>교육용</b>
  ⚠️ 이 화면의 모든 회사·직원·자산 정보는 학습용으로 지어낸 <u>가상 자료</u>입니다.
  <span>실존 인물·기업과 무관하며 실제 인사·회계 업무에 사용할 수 없습니다.</span>

    <div class="side-foot">
      기준일 <b id="todayTxt">-</b><br>
      담당자 경영지원팀 (교육생)
    </div>

  <main id="view"></main>
</div>

<script>
(function(){
'use strict';

/* ====================== 기초 자료 ====================== */
var SEED   = JSON.parse(document.getElementById('seed').textContent);
var TODAY  = SEED.company.baseDate;          /* 교육용이라 '오늘'을 2026-09-14로 고정 */
var LSKEY  = 'hanbit-hr-demo-v1';

var EMP = {}, AST = {}, HOL = {}, SEEDLEAVE = {}, SEEDLOAN = {};
SEED.employees.forEach(function(e){ EMP[e.id]=e; });
SEED.assets.forEach(function(a){ AST[a.id]=a; });
SEED.holidays.forEach(function(h){ HOL[h.date]=h.name; });
SEED.leaves.forEach(function(l){ SEEDLEAVE[l.id]=l; });
SEED.loans.forEach(function(n){ SEEDLOAN[n.id]=n; });
var DEPTS = SEED.employees.map(function(e){return e.dept;}).filter(function(v,i,a){return a.indexOf(v)===i;});
var WD = ['일','월','화','수','목','금','토'];
var LEAVE_TYPES = ['연차','반차(오전)','반차(오후)','병가','경조사'];

/* ====================== 상태 저장 ====================== */
var state = load();
var ui = { page:'dash', attYm:'2026-09', attDept:'', attBad:false,
           leaveTab:'대기', leaveDept:'', assetCat:'', assetShort:false, loanTab:'전체' };

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function blank(){
  return { leaves:clone(SEED.leaves), loans:clone(SEED.loans),
           flags:{overWarn:false,sawShortage:false,sawBadAtt:false}, seq:{L:100,N:100} };
}
function load(){
  try{
    var raw = localStorage.getItem(LSKEY);
    if(raw){
      var o = JSON.parse(raw);
      if(o && o.leaves && o.loans){
        o.flags = Object.assign({overWarn:false,sawShortage:false,sawBadAtt:false}, o.flags||{});
        o.seq   = Object.assign({L:100,N:100}, o.seq||{});
        return o;
      }
    }
  }catch(e){}
  return blank();
}
function save(){
  try{ localStorage.setItem(LSKEY, JSON.stringify(state)); }
  catch(e){ toast('브라우저 저장에 실패했습니다. 시크릿 모드인지 확인해 주세요.', true); }
}

/* ====================== 날짜 도구 ====================== */
function pad(n){ return (n<10?'0':'')+n; }
function ymd(y,m,d){ return y+'-'+pad(m)+'-'+pad(d); }
function dObj(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function dStr(dt){ return ymd(dt.getFullYear(),dt.getMonth()+1,dt.getDate()); }
function addDays(s,n){ var d=dObj(s); d.setDate(d.getDate()+n); return dStr(d); }
function isWeekend(s){ var w=dObj(s).getDay(); return w===0||w===6; }
function isHoliday(s){ return !!HOL[s]; }
function isWorkday(s){ return !isWeekend(s) && !isHoliday(s); }
function workdaysBetween(a,b){
  if(!a||!b||a>b) return 0;
  var n=0, c=a, guard=0;
  while(c<=b && guard++<400){ if(isWorkday(c)) n++; c=addDays(c,1); }
  return n;
}
function daysAfter(from,to){ return Math.round((dObj(to)-dObj(from))/86400000); }
function kdate(s){ if(!s) return '-'; var d=dObj(s); return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'; }
function won(n){ return n.toLocaleString('ko-KR'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ====================== 근태 자동 생성 ======================
   실제 출퇴근 기록 대신, 사원번호+날짜로 늘 같은 결과가 나오는
   가상 근태를 계산해서 만듭니다. 새로고침해도 값이 변하지 않습니다. */
function hash(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function rnd(s){ return hash(s)/4294967296; }

function leaveCodeOf(empId, date){
  for(var i=0;i<state.leaves.length;i++){
    var l = state.leaves[i];
    if(l.empId!==empId || l.status!=='승인') continue;
    if(date>=l.start && date<=l.end){
      if(l.type==='연차') return 'V';
      if(l.type.indexOf('반차')===0) return 'H';
      return 'S';
    }
  }
  return null;
}
function attCode(emp, date){
  if(!isWorkday(date)) return null;          /* 주말·공휴일 */
  if(date > TODAY)     return 'F';           /* 아직 오지 않은 날 */
  var lc = leaveCodeOf(emp.id, date); if(lc) return lc;
  var r = rnd(emp.id+'|'+date);
  var lateBias = (hash(emp.id)%7)/100;                                  /* 사람마다 지각 성향이 다름 */
  var tripBias = emp.dept.indexOf('영업')===0 ? 0.09 : 0.015;           /* 영업팀은 출장이 잦음 */
  var p = 0;
  p += 0.015 + lateBias; if(r<p) return 'L';
  p += 0.012;            if(r<p) return 'E';
  p += 0.010;            if(r<p) return 'A';
  p += tripBias;         if(r<p) return 'T';
  return 'O';
}
var MARK = { O:{c:'mk-o',t:'·',n:'정상'}, L:{c:'mk-l',t:'지',n:'지각'}, E:{c:'mk-e',t:'조',n:'조퇴'},
             A:{c:'mk-a',t:'결',n:'결근'}, V:{c:'mk-v',t:'연',n:'연차'}, H:{c:'mk-h',t:'반',n:'반차'},
             T:{c:'mk-t',t:'출',n:'출장'}, S:{c:'mk-s',t:'병',n:'병가·경조사'}, F:{c:'mk-o',t:'',n:''} };

function attRow(emp, ym){
  var p=ym.split('-'), y=+p[0], m=+p[1];
  var dim = new Date(y,m,0).getDate();
  var r = { codes:{}, work:0, late:0, early:0, absent:0, trip:0, leave:0, etc:0, normal:0 };
  for(var d=1; d<=dim; d++){
    var date = ymd(y,m,d);
    var c = attCode(emp,date);
    r.codes[d]=c;
    if(!c || c==='F') continue;
    r.work++;
    if(c==='O'){ r.normal++; }
    else if(c==='L'){ r.late++;  r.normal++; }
    else if(c==='E'){ r.early++; r.normal++; }
    else if(c==='T'){ r.trip++;  r.normal++; }
    else if(c==='A'){ r.absent++; }
    else if(c==='V'){ r.leave+=1; }
    else if(c==='H'){ r.leave+=0.5; r.normal++; }
    else if(c==='S'){ r.etc++; }
  }
  r.bad = r.late + r.early + r.absent;
  return r;
}

function leaveBal(empId){
  var e = EMP[empId], used=0, etc=0;
  state.leaves.forEach(function(l){
    if(l.empId!==empId || l.status!=='승인') return;
    if(l.type==='연차' || l.type.indexOf('반차')===0) used += l.days; else etc += l.days;
  });
  return { total:e.annual, used:+used.toFixed(1), etc:+etc.toFixed(1), remain:+(e.annual-used).toFixed(1) };
}
function stock(assetId){
  var a = AST[assetId], out=0;
  state.loans.forEach(function(n){
    if(n.assetId!==assetId) return;
    if(a.category==='소모품') out += n.qty;
    else if(!n.returnDate)   out += n.qty;
  });
  return { total:a.total, out:out, avail:a.total-out };
}
function isOverdue(n){
  return !n.returnDate && n.dueDate && n.dueDate < TODAY && AST[n.assetId].category!=='소모품';
}
function overdueList(){ return state.loans.filter(isOverdue); }
function pendingLeaves(){ return state.leaves.filter(function(l){ return l.status==='대기'; }); }
function shortAssets(){ return SEED.assets.filter(function(a){ return stock(a.id).avail<=0; }); }
function lowAssets(){ return SEED.assets.filter(function(a){ var s=stock(a.id); return s.avail>0 && s.avail<=2; }); }

/* ====================== 동작 연결 ====================== */
function approve(id){
  var l = state.leaves.filter(function(x){return x.id===id;})[0];
  if(!l || l.status!=='대기') return;
  var b = leaveBal(l.empId);
  var isAnnual = l.type==='연차' || l.type.indexOf('반차')===0;
  if(isAnnual && l.days > b.remain){
    state.flags.overWarn = true; save();
    toast(EMP[l.empId].name+' 사원의 잔여 연차('+b.remain+'일)보다 많아 승인할 수 없습니다.', true);
    render(); return;
  }
  l.status='승인'; l.actDate=TODAY; l.approver='교육생(인사담당)'; l.comment='';
  save(); toast(EMP[l.empId].name+' 사원의 휴가를 승인했습니다.'); render();
}
function reject(id){
  var l = state.leaves.filter(function(x){return x.id===id;})[0];
  if(!l || l.status!=='대기') return;
  var e = EMP[l.empId];
  openModal('휴가 반려 — '+e.name+' '+e.rank,
    '<div style="font-size:14px;line-height:1.5;color:var(--ink-2)">'+esc(l.type)+' · '+esc(l.start)+
      (l.end!==l.start?' ~ '+esc(l.end):'')+' ('+l.days+'일)<br>신청 사유: '+esc(l.reason)+'</div>'+
    '<label class="f">반려 사유 <span style="color:var(--danger)">*</span>'+
      '<textarea id="rjTxt" placeholder="예: 같은 날 팀 필수 인원 미달"></textarea></label>'+
    '<div id="rjMsg"></div>',
    '반려 처리',
    function(ovl, close){
      var t = ovl.querySelector('#rjTxt').value.trim();
      if(!t){ ovl.querySelector('#rjMsg').innerHTML='<div class="err">반려 사유를 반드시 입력해야 합니다.</div>'; return false; }
      l.status='반려'; l.actDate=TODAY; l.approver='교육생(인사담당)'; l.comment=t;
      save(); close(); toast(e.name+' 사원의 휴가를 반려했습니다.'); render();
    });
}
function giveBack(id){
  var n = state.loans.filter(function(x){return x.id===id;})[0];
  if(!n || n.returnDate) return;
  n.returnDate = TODAY;
  save(); toast(AST[n.assetId].name+' 반납 처리했습니다.'); render();
}

function calcDays(type, s, e){
  if(type.indexOf('반차')===0) return isWorkday(s) ? 0.5 : 0;
  return workdaysBetween(s,e);
}
function bindLeaveForm(){
  var sel = document.getElementById('nlEmp');
  if(!sel) return;
  function paintBal(){
    var b = leaveBal(sel.value);
    document.getElementById('nlBal').innerHTML =
      '<div class="balbox">연차 부여 <b>'+b.total+'일</b> · 사용 <b>'+b.used+'일</b> · '+
      '남은 연차 <b style="color:'+(b.remain>0?'var(--ok)':'var(--danger)')+'">'+b.remain+'일</b>'+
      (b.etc?' · 병가·경조사 <b>'+b.etc+'일</b>':'')+'</div>';
  }
  paintBal();
  sel.onchange = paintBal;
  var tp = document.getElementById('nlType'), st = document.getElementById('nlStart'), en = document.getElementById('nlEnd');
  tp.onchange = function(){ if(tp.value.indexOf('반차')===0){ en.value = st.value; en.disabled = true; } else en.disabled = false; };
  st.onchange = function(){ if(en.disabled || en.value < st.value) en.value = st.value; };

  document.getElementById('nlAdd').onclick = function(){
    var msg = document.getElementById('nlMsg');
    var empId = sel.value, type = tp.value, s = st.value, e = en.disabled ? st.value : en.value;
    var reason = document.getElementById('nlReason').value.trim();
    if(!s || !e || s > e){ msg.innerHTML='<div class="err">기간을 다시 확인해 주세요.</div>'; return; }
    if(!reason){ msg.innerHTML='<div class="err">사유를 입력해 주세요.</div>'; return; }
    var days = calcDays(type, s, e);
    if(days<=0){ msg.innerHTML='<div class="err">선택한 기간이 전부 주말·공휴일입니다. 다른 날짜를 골라 주세요.</div>'; return; }
    var b = leaveBal(empId);
    if((type==='연차'||type.indexOf('반차')===0) && days > b.remain){
      state.flags.overWarn = true; save();
      msg.innerHTML = '<div class="err">⚠️ 잔여 연차 초과<br>신청 '+days+'일 &gt; 남은 연차 '+b.remain+
        '일 — 이 신청은 등록할 수 없습니다.</div>';
      renderMissions();
      return;
    }
    state.seq.L++;
    state.leaves.push({ id:'L'+state.seq.L, empId:empId, type:type, start:s, end:e, days:days,
      reason:reason, status:'대기', reqDate:TODAY, actDate:'', approver:'', comment:'' });
    save();
    toast(EMP[empId].name+' 사원의 휴가 신청('+days+'일)을 등록했습니다.');
    ui.leaveTab='대기'; render();
  };
}
function bindLoanForm(){
  var as = document.getElementById('nnAsset');
  if(!as) return;
  document.getElementById('nnAdd').onclick = function(){
    var msg = document.getElementById('nnMsg');
    var assetId = as.value, empId = document.getElementById('nnEmp').value;
    var qty = parseInt(document.getElementById('nnQty').value,10);
    var outD = document.getElementById('nnOut').value;
    var dueD = document.getElementById('nnDue').value;
    var note = document.getElementById('nnNote').value.trim() || '교육 실습 불출';
    if(!assetId){ msg.innerHTML='<div class="err">불출할 비품을 선택해 주세요.</div>'; return; }
    if(!(qty>0)){ msg.innerHTML='<div class="err">수량은 1개 이상이어야 합니다.</div>'; return; }
    if(!outD){ msg.innerHTML='<div class="err">불출일을 입력해 주세요.</div>'; return; }
    var s = stock(assetId);
    if(qty > s.avail){ msg.innerHTML='<div class="err">가용수량('+s.avail+')보다 많이 불출할 수 없습니다.</div>'; return; }
    if(dueD && dueD < outD){ msg.innerHTML='<div class="err">반납예정일이 불출일보다 빠릅니다.</div>'; return; }
    if(AST[assetId].category==='소모품') dueD='';
    state.seq.N++;
    state.loans.push({ id:'N'+state.seq.N, assetId:assetId, empId:empId, qty:qty,
      outDate:outD, dueDate:dueD, returnDate:'', note:note });
    save();
    toast(AST[assetId].name+' '+qty+'개를 '+EMP[empId].name+' 사원에게 불출했습니다.');
    ui.loanTab='전체'; render();
  };
}

/* ====================== 자료 내보내기 / 되돌리기 ====================== */
function exportJSON(){
  var out = {
    '_주의':'교육용 가상 자료입니다. 실존 인물·기업과 무관합니다.',
    company:SEED.company, holidays:SEED.holidays,
    employees:SEED.employees, assets:SEED.assets,
    leaves:state.leaves, loans:state.loans,
    저장시각:new Date().toISOString()
  };
  var blob = new Blob([JSON.stringify(out,null,2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = '한빛상사_교육용가상자료_'+TODAY+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  toast('실습 내용을 JSON 파일로 내려받았습니다.');
}
function importJSON(){
  var inp = document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange = function(){
    var f = inp.files[0]; if(!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      try{
        var o = JSON.parse(fr.result);
        if(!o.leaves || !o.loans) throw new Error('형식이 다릅니다');
        state.leaves = o.leaves; state.loans = o.loans;
        save(); toast('파일을 불러왔습니다.'); render();
      }catch(e){ toast('불러오기 실패: 이 앱에서 내려받은 JSON 파일인지 확인해 주세요.', true); }
    };
    fr.readAsText(f);
  };
  inp.click();
}
function resetAll(){
  if(!confirm('실습한 내용이 모두 지워지고 처음 상태로 돌아갑니다.\n계속할까요?')) return;
  try{ localStorage.removeItem(LSKEY); }catch(e){}
  state = blank();
  ui.leaveTab='대기'; ui.loanTab='전체'; ui.attBad=false; ui.assetShort=false;
  toast('처음 상태로 되돌렸습니다.');
  render();
}

/* ====================== 미션 패널 ====================== */
function renderMissions(){
  var done = missionCount();
  var h = '<div class="mpanel"><h3>📋 실습 미션<span class="cnt">'+done+' / '+MISSIONS.length+'</span></h3><ol>';
  MISSIONS.forEach(function(m){
    var ok = missionDone(m);
    var pg = m.need>1 ? Math.min(m.got(),m.need)+'/'+m.need : '';
    h += '<li class="'+(ok?'done':'')+'" data-go="'+m.page+'" title="'+esc(m.hint)+'">'+
         '<span class="bx">✓</span><span>'+esc(m.t)+'</span>'+
         (pg?'<span class="pg">'+pg+'</span>':'')+'</li>';
  });
  h += '</ol></div>';
  if(done===MISSIONS.length){
    h += '<div class="mdone">🎉 미션을 모두 끝냈습니다!<br>[처음 상태로 초기화]를 누르면 다시 연습할 수 있습니다.</div>';
  }
  var host = document.getElementById('missionHost');
  host.innerHTML = h;
  Array.prototype.forEach.call(host.querySelectorAll('li[data-go]'), function(li){
    li.onclick = function(){ ui.page = li.getAttribute('data-go'); render(); };
  });
}

/* ====================== 라우터 ====================== */
var PAGES = [
  {k:'dash',  ic:'▣', t:'대시보드'},
  {k:'att',   ic:'▤', t:'근태 현황'},
  {k:'leave', ic:'✈', t:'휴가 관리'},
  {k:'asset', ic:'▦', t:'비품 대장'},
  {k:'loan',  ic:'⇄', t:'불출·반납'}
];
function renderNav(){
  var nav = document.getElementById('nav');
  nav.innerHTML = PAGES.map(function(p){
    var badge = '';
    if(p.k==='leave' && pendingLeaves().length) badge = '<span class="pip">'+pendingLeaves().length+'</span>';
    if(p.k==='loan'  && overdueList().length)   badge = '<span class="pip">'+overdueList().length+'</span>';
    return '<button data-p="'+p.k+'" class="'+(ui.page===p.k?'on':'')+'"><span class="ic">'+p.ic+'</span>'+p.t+badge+'</button>';
  }).join('');
  Array.prototype.forEach.call(nav.querySelectorAll('button'), function(b){
    b.onclick = function(){ ui.page = b.getAttribute('data-p'); render(); };
  });
}
function renderBanner(){
  var b = document.getElementById('eduBanner');
  b.innerHTML = '<b>교육용</b>'+
    '⚠️ 이 화면의 모든 회사·직원·자산 정보는 학습용으로 지어낸 <u>가상 자료</u>입니다.'+
    '<span>실존 인물·기업과 무관하며 실제 인사·회계 업무에 사용할 수 없습니다.</span>';
}
function render(){
  renderNav();
  renderBanner();
  var v = document.getElementById('view');
  v.innerHTML = ui.page==='dash'  ? renderDash()
              : ui.page==='att'   ? renderAtt()
              : ui.page==='leave' ? renderLeave()
              : ui.page==='asset' ? renderAsset()
              :                     renderLoan();
  v.scrollTop = 0;

  /* 공통 툴바 */
  var be = document.getElementById('btnExport'); if(be) be.onclick = exportJSON;
  var bi = document.getElementById('btnImport'); if(bi) bi.onclick = importJSON;
  var br = document.getElementById('btnReset');  if(br) br.onclick = resetAll;

  /* 승인 / 반려 / 반납 */
  Array.prototype.forEach.call(v.querySelectorAll('[data-ok]'), function(b){
    b.onclick = function(){ approve(b.getAttribute('data-ok')); }; });
  Array.prototype.forEach.call(v.querySelectorAll('[data-no]'), function(b){
    b.onclick = function(){ reject(b.getAttribute('data-no')); }; });
  Array.prototype.forEach.call(v.querySelectorAll('[data-ret]'), function(b){
    b.onclick = function(){ giveBack(b.getAttribute('data-ret')); }; });

  /* 근태 필터 */
  var ay = document.getElementById('attYm');   if(ay) ay.onchange = function(){ ui.attYm=ay.value; render(); };
  var ad = document.getElementById('attDept'); if(ad) ad.onchange = function(){ ui.attDept=ad.value; render(); };
  var ab = document.getElementById('attBad');  if(ab) ab.onclick = function(){
    ui.attBad = !ui.attBad;
    if(ui.attBad && !state.flags.sawBadAtt){ state.flags.sawBadAtt = true; save(); }
    render();
  };

  /* 휴가 필터 */
  Array.prototype.forEach.call(v.querySelectorAll('[data-ltab]'), function(b){
    b.onclick = function(){ ui.leaveTab = b.getAttribute('data-ltab'); render(); }; });
  var ld = document.getElementById('lvDept'); if(ld) ld.onchange = function(){ ui.leaveDept=ld.value; render(); };

  /* 비품 필터 */
  var ac = document.getElementById('asCat');   if(ac) ac.onchange = function(){ ui.assetCat=ac.value; render(); };
  var ash = document.getElementById('asShort'); if(ash) ash.onclick = function(){
    ui.assetShort = !ui.assetShort;
    if(ui.assetShort && !state.flags.sawShortage){ state.flags.sawShortage = true; save(); }
    render();
  };

  /* 불출 탭 */
  Array.prototype.forEach.call(v.querySelectorAll('[data-ntab]'), function(b){
    b.onclick = function(){ ui.loanTab = b.getAttribute('data-ntab'); render(); }; });

  bindLeaveForm();
  bindLoanForm();
  bindAiCheck();
  renderMissions();
}

/* ====================== 시작 ====================== */
document.getElementById('todayTxt').textContent = TODAY + ' (' + WD[dObj(TODAY).getDay()] + ')';
var foot = document.querySelector('.side-foot');
var host = document.createElement('div');
host.id = 'missionHost';
foot.parentNode.insertBefore(host, foot);
render();

})();
</script>
